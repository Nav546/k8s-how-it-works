# 1 control plane + 2 workers. If your laptop struggles, delete one worker.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # the NodePort used by the web Service
        hostPort: 8080         # -> http://localhost:8080
        listenAddress: "127.0.0.1"
  - role: worker
  - role: worker
