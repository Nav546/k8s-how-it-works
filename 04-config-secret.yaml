# Step 4: move settings out of the Deployment.
# Create the Secret FIRST (it is deliberately not stored in git):
#   kubectl create secret generic redis-secret --from-literal=REDIS_PASSWORD='pick-a-password'
#
# Then apply this file. It contains:
#   1. a ConfigMap (non-secret settings)
#   2. the web Deployment, UPDATED (same name -> Kubernetes does a rolling update)
#   3. the redis Deployment, UPDATED to require the password
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
data:
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  APP_TITLE: "Visit Counter on Kubernetes"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 3                      # changed from 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      enableServiceLinks: false   # stop K8s injecting REDIS_PORT=tcp://... (see README troubleshooting)
      containers:
        - name: web
          image: k8s-visit-counter:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:                 # changed: settings come from the ConfigMap
            - configMapRef:
                name: web-config
          env:                     # changed: password comes from the Secret
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      enableServiceLinks: false   # stop K8s injecting REDIS_PORT=tcp://... (see README troubleshooting)
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]   # changed
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 5
